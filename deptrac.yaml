# Deptrac configuration, imports the shared magicsunday/coding-standard ruleset.
# This repository installs its dev tooling into .build/vendor, so the import path
# points there (as the PHPStan include does). The import supplies the shared
# layers and their order, this file only adds to it.
#
# This package adds its own layers: View (presentation vocabulary, no first-party
# dependency of its own) sits just above Support, Payload (the wire payloads of
# the widgets, built on Model) sits just above Model, and Aggregator (the row
# mappers and tallies that build the payloads) sits between Contract and
# Repository.
# The layer graph must stay acyclic and every `src/` class must belong to a
# layer, both are checked by `composer ci:test:php:deptrac`.
imports:
    - .build/vendor/magicsunday/coding-standard/deptrac/layers.yaml

deptrac:
    paths:
        - src

    # This module predates the canonical namespace scheme. Map its non-canonical
    # namespaces onto the shared canonical layers by adding collectors to a
    # same-named layer, so the ruleset enforces them without any rename. The
    # `Normalization` occupation seam
    # mixes roles that map to different canonical layers, so each class is placed by
    # an exact FQCN (a bare segment regex is unsafe, but an anchored first-party FQCN
    # cannot collide with a vendor class):
    #   - the normalized-result value object -> Model;
    #   - the standardizer-module adapter implements the port -> Adapter; only the
    #     composition root wires it in;
    #   - the folding table the repositories fold values through builds Model values
    #     from the port -> Aggregator, next to the other row folds;
    #   - the seam's port lives in `Normalization\Contract\` and its helpers in
    #     `Normalization\Support\`, which the shared directory layers already cover.
    # The public facade is the root `Statistic` class and the composition root is the
    # root `Module` class — both are root-level files, not `\Facade\` / `\Module\`
    # namespaces, so the shared directory layers miss them and each is mapped by its
    # exact FQCN (which cannot collide with a vendor class). The `Traits\` helpers
    # are mixed into `Module` only and belong to the composition root with it.
    layers:
        -
            name: Model
            collectors:
                -
                    type: classNameRegex
                    value: '#^MagicSunday\\Webtrees\\Statistic\\Normalization\\NormalizedOccupation$#'
        -
            name: Adapter
            collectors:
                -
                    type: classNameRegex
                    value: '#^MagicSunday\\Webtrees\\Statistic\\Normalization\\StandardizerModuleNormalizer$#'
        -
            name: Facade
            collectors:
                -
                    type: classNameRegex
                    value: '#^MagicSunday\\Webtrees\\Statistic\\Statistic$#'
        -
            name: Module
            collectors:
                -
                    type: classNameRegex
                    value: '#^MagicSunday\\Webtrees\\Statistic\\Module$#'
                -
                    type: directory
                    value: 'src/Traits/.*'

        # Package-local layers.
        -
            # Application logic between the repositories and the payloads: the
            # row mappers, tallies and resolvers that fold a query result into a
            # widget payload (GH-319 moved them out of Support, which must stay
            # domain-agnostic).
            name: Aggregator
            collectors:
                -
                    type: directory
                    value: 'src/Aggregator/.*'
                -
                    type: classNameRegex
                    value: '#^MagicSunday\\Webtrees\\Statistic\\Normalization\\OccupationFolding$#'
        -
            # The wire payloads that the widget partials serialise into the data
            # attributes of a chart: display-driven DTOs that implement
            # `JsonSerializable` and map a domain axis onto a neutral wire key. They
            # build on the Model value objects and depend on nothing else.
            name: Payload
            collectors:
                -
                    type: directory
                    value: 'src/Payload/.*'
        -
            # The card / section / widget builders and the presentation enums the
            # view templates consume. Self-contained: no first-party dependency.
            name: View
            collectors:
                -
                    type: directory
                    value: 'src/View/.*'
        -
            # The database manager. A vendor class, so it is matched by an anchored
            # FQCN — a `directory` collector only sees analysed files — and it is a
            # target only: nothing here depends on it except the two places granted
            # below.
            name: Database
            collectors:
                -
                    type: classNameRegex
                    value: '#^Illuminate\\Database\\Capsule\\Manager$#'
        -
            # OVERLAY: every src/ class outside Repository and Support\Database, a
            # second time. Raw database access is confined to the repositories and to
            # the dedicated Support\Database helpers; Support is a SHARED layer, so the
            # Support\Database grant (`Support: [Database]` below) cannot be carved out
            # of it locally. Instead the grant goes to all of Support, and this overlay
            # — whose allow-list omits Database — takes it back from every class that
            # is not in Support\Database. A class is checked against every layer it
            # belongs to, so a `DB::` call from e.g. Support\Gedcom, Aggregator or the
            # Statistic facade is reported here. Add such a call and run
            # `composer ci:test:php:deptrac` to see the report.
            name: NoDatabaseAccess
            collectors:
                -
                    type: bool
                    must:
                        -
                            type: directory
                            value: 'src/.*'
                    must_not:
                        -
                            type: directory
                            value: 'src/Repository/.*'
                        -
                            type: directory
                            value: 'src/Support/Database/.*'

    # The local widenings. Two things are listed on (nearly) every layer, both forced
    # by the overlay: a layer whose members also sit in NoDatabaseAccess lists
    # itself, and every layer that depends on an overlaid class lists
    # NoDatabaseAccess next to the class's own layer. The overlay in turn lists
    # every layer but Database: the real layer of each member still decides what
    # that member may depend on. Remove one of these entries and run
    # `composer ci:test:php:deptrac` to see which edges it was granting.
    ruleset:
        Model:
            - Model
            - NoDatabaseAccess
        Support:
            - Support
            - Database
            - NoDatabaseAccess
        Enum:
            - Enum
            - NoDatabaseAccess
        Contract:
            - Contract
            - NoDatabaseAccess
        View:
            - View
            - NoDatabaseAccess
        Payload:
            - Payload
            - Model
            - NoDatabaseAccess
        Aggregator:
            - Aggregator
            - Support
            - Enum
            - Model
            - Payload
            - Contract
            - View
            - NoDatabaseAccess
        Repository:
            - Repository
            - Aggregator
            - Payload
            - Database
            - NoDatabaseAccess
        Adapter:
            - Adapter
            - NoDatabaseAccess
        Facade:
            - Facade
            - Payload
            - NoDatabaseAccess
        Module:
            - Module
            - NoDatabaseAccess
        NoDatabaseAccess:
            - Support
            - Enum
            - Model
            - Configuration
            - Contract
            - View
            - Payload
            - Aggregator
            - Repository
            - Adapter
            - Service
            - Facade
            - Module
            - NoDatabaseAccess

    formatters:
        graphviz:
            # The layer graph of the cycle check. NoDatabaseAccess is an overlay:
            # every member also belongs to its real layer, so every real edge still
            # appears there and a real cycle stays visible. Hiding it removes only the
            # overlay <-> twin pairs, which are two names for the same classes and no
            # dependency between layers. Only overlays go here, never a layer whose
            # classes belong to no other layer.
            hidden_layers:
                - NoDatabaseAccess
