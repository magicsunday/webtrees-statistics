name: CI

on:
    push:
        branches: [main, master, '*.x', WIP]
    pull_request:

permissions:
    contents: read

jobs:
    # The PHP gates come from the shared reusable so the canonical step list lives
    # in one place. The composer scripts this repository declares decide which
    # optional gates it opts into: `jq -r '.scripts | keys[] |
    # select(startswith("ci:test:php:"))' composer.json`. Copy-paste detection
    # runs in the shared Node-only lane below, since jscpd is a Node tool. The
    # release-zip smoke test stays in the JS lane below, because the zip is worth
    # building once rather than once per matrix leg.
    # Analysis runs on 8.4/8.5 only — not because 8.3 fails to install. This
    # repository gitignores composer.lock, so CI resolves from scratch, and that
    # resolution SUCCEEDS on 8.3: the solver picks a PHPUnit line that still
    # supports it, so an 8.3 leg would gate against a different test framework
    # than the legs that actually gate the code. To see the current difference,
    # run `composer update --dry-run` in the 8.3 and 8.5 buildboxes and diff the
    # locked versions.
    # Runtime support for 8.3 stays declared by composer.json's require.php
    # constraint and is validated statically by PHPStan's phpVersion: 80300; it
    # is simply not unit-tested on a real 8.3 runtime.
    php:
        uses: magicsunday/.github/.github/workflows/php-quality.yml@main
        permissions:
            contents: read
        with:
            # These values name the job, and `php / Build (8.4)` and
            # `php / Build (8.5)` are REQUIRED status checks on main. Removing or
            # renaming one — or renaming the `php:` job id — strands a required
            # context, and every pull request then sits at BLOCKED with all
            # visible checks green. Adding one blocks nothing, but leaves the new
            # leg ungated: a regression there cannot stop a merge. Either way,
            # update branch protection in the same change.
            # List the current set with:
            # gh api repos/{owner}/{repo}/branches/main/protection --jq .required_status_checks.contexts
            php-versions: '["8.4", "8.5"]'

    cpd:
        uses: magicsunday/.github/.github/workflows/cpd.yml@main
        permissions:
            contents: read

    js:
        name: JS and release zip
        runs-on: ubuntu-latest

        steps:
            - id: checkout
              name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - id: setup_node
              name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: npm

            # 8.4, not the 8.3 runtime floor: this job runs `composer install`
            # with dev dependencies, and pinning it to the analysed lane's
            # interpreter keeps it resolving the same tree — on 8.3 the solver
            # would pick another PHPUnit line (see the `php:` job
            # comment). This lane exercises none of those packages, so the pin is
            # about tree parity rather than a failure it would otherwise hit.
            - id: setup_php
              name: Set up PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  tools: composer:v2

            - name: Validate composer.json
              run: composer validate

            - id: install
              name: Install dependencies
              env:
                  COMPOSER_NO_AUDIT: "1"
                  COMPOSER_NO_INTERACTION: "1"
              run: |
                  composer install --no-progress
                  npm ci

            - id: js-lint
              name: JS Lint
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:js:lint

            - id: js-format
              name: JS Format
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:js:format

            - id: js-typecheck
              name: JS Typecheck
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:js:typecheck

            - id: js-unit
              name: JS Unit Tests
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:js:unit

            # One leg is enough: the ignored advisories name exact-pinned transitive
            # dependencies of webtrees, which `composer why <package>` traces.
            - id: advisories
              name: Stale advisory ignores
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:advisories

            # Runs LAST: 'make dist' invokes 'composer update --no-dev', which
            # strips the dev packages from .build/vendor. Nothing placed after it
            # may depend on that tree.
            - id: dist-smoke
              name: Release zip smoke test
              if: ${{ success() }}
              run: |
                  make dist
                  make dist-smoke
                  rm -f *.zip

    # The integration tests default to in-memory SQLite. This job re-runs the
    # DB-touching ones against a real MySQL 8, the gate for the whole error-1055
    # (ONLY_FULL_GROUP_BY) bug class that SQLite tolerates. MySQL, not MariaDB:
    # the reason is in the class docblock of AbstractIntegrationTestCase. One PHP
    # version is enough, the failure is engine-specific and not PHP-version-specific.
    integration-mysql:
        name: Integration tests (MySQL 8, ONLY_FULL_GROUP_BY)
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
                env:
                    MYSQL_ROOT_PASSWORD: ci-test
                    MYSQL_DATABASE: webtrees_test
                    # The suite connects as this account, which holds privileges
                    # on the test database only.
                    MYSQL_USER: webtrees_ci
                    MYSQL_PASSWORD: ci-test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -uroot -pci-test"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            - id: checkout
              name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - id: setup_php
              name: Set up PHP version 8.4
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  extensions: pdo_mysql
                  tools: composer:v2

            - id: install
              name: Install dependencies
              env:
                  COMPOSER_NO_AUDIT: "1"
                  COMPOSER_NO_INTERACTION: "1"
              run: |
                  composer install --no-progress

            # The service container is discarded after the job and the per-test
            # wipe commits often, so skipping the redo-log and binlog fsyncs cuts
            # the wall-clock time. The job owns the server, the test suite never
            # changes global settings.
            - id: tune_server
              name: Relax durability of the throwaway server
              run: |
                  mysql --protocol=tcp --host=127.0.0.1 --user=root --password=ci-test \
                      --execute="SET GLOBAL innodb_flush_log_at_trx_commit = 2; SET GLOBAL sync_binlog = 0;"

            - id: integration
              name: Integration tests against MySQL
              env:
                  # Per-test schema resets against a real server outrun
                  # Composer's default 300 s process timeout.
                  COMPOSER_PROCESS_TIMEOUT: "0"
                  WT_TEST_DB_DRIVER: mysql
                  WT_TEST_DB_HOST: 127.0.0.1
                  WT_TEST_DB_PORT: "3306"
                  WT_TEST_DB_NAME: webtrees_test
                  WT_TEST_DB_USER: webtrees_ci
                  WT_TEST_DB_PASSWORD: ci-test
                  WT_TEST_DB_ALLOW_DESTRUCTIVE: "1"
              run: |
                  composer ci:test:php:integration
